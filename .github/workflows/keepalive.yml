name: Keep Supabase awake

on:
  schedule:
    - cron: "0 3 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query a real table
        # Hitting /rest/v1/ alone returns 401 because the root path needs both
        # apikey and Authorization. A small select exercises the database for
        # real, which is what keeps a free project from pausing.
        run: |
          curl --fail --silent --show-error \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/badges?select=id&limit=1" \
            -o /dev/null
