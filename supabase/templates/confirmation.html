<!--
  Paste this into Supabase → Authentication → Emails → "Confirm signup".
  Subject: Vancord dogrulama kodun

  The app verifies a 6-digit code with supabase.auth.verifyOtp({ type: "signup" }),
  which only works when the template contains {{ .Token }}.
-->
<div style="font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#fbfaf8;padding:32px">
  <div style="max-width:420px;margin:0 auto;background:#ffffff;border:1px solid #e2ded6;border-radius:14px;padding:28px">
    <div style="font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#1f5f52">
      Vancord
    </div>
    <h1 style="margin:12px 0 6px;font-size:20px;color:#1b1a17">Dogrulama kodun</h1>
    <p style="margin:0 0 20px;font-size:14px;line-height:1.6;color:#736e65">
      Hesabini etkinlestirmek icin asagidaki 6 haneli kodu uygulamaya gir.
    </p>
    <div style="font-family:ui-monospace,Consolas,monospace;font-size:30px;font-weight:600;letter-spacing:10px;color:#1b1a17;background:#f4f2ee;border-radius:10px;padding:16px 0;text-align:center">
      {{ .Token }}
    </div>
    <p style="margin:20px 0 0;font-size:12px;line-height:1.6;color:#736e65">
      Kodu sen istemediysen bu e-postayi yok sayabilirsin.
      <br />Kod 60 dakika gecerlidir.
    </p>
  </div>
</div>
